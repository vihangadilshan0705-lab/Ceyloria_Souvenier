
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | Ceyloria Souvenirs</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f3ee;color:#10243d}
header{background:#10243d;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{font-size:25px;font-weight:bold;color:#d6ad62}
header nav{display:flex;gap:18px;flex-wrap:wrap}
header a{color:white;text-decoration:none}
.hero{text-align:center;padding:35px 15px 20px}
.hero h1{margin:0 0 8px}
.container{max-width:1250px;margin:auto;padding:20px}
.search{width:100%;padding:14px;border:1px solid #ccc;border-radius:7px;font-size:16px;margin-bottom:20px}
.layout{display:grid;grid-template-columns:210px 1fr;gap:22px}
.categories,.panel{background:white;padding:18px;border-radius:9px}
.categories h3{margin-top:0}

.category-btn{display:block;width:100%;text-align:left;padding:12px;margin:5px 0;border:0;border-radius:5px;background:#f2f2f2;color:#10243d;cursor:pointer}
.category-btn.active,.category-btn:hover{background:#10243d;color:white}
.category-group{margin:5px 0}
.category-main-row{display:flex;align-items:center;gap:5px}
.category-main-row .category-btn{flex:1;margin:0}
.category-toggle{width:38px;min-width:38px;height:40px;border:0;border-radius:5px;background:#f2f2f2;color:#10243d;cursor:pointer;font-size:18px;transition:transform .2s,background .2s}
.category-toggle:hover{background:#e7d5ae}
.category-toggle[aria-expanded="true"]{background:#d6ad62;transform:rotate(90deg)}
.subcategory-list{display:none;padding:5px 0 3px 14px}
.subcategory-list.open{display:block}
.subcategory-btn{display:block;width:100%;text-align:left;padding:9px 11px;margin:4px 0;border:0;border-radius:5px;background:#faf8f3;color:#33465a;cursor:pointer;font-size:13px}
.subcategory-btn.active,.subcategory-btn:hover{background:#ead8b2;color:#10243d}

.buy-now-card{position:relative;overflow:hidden;background:#10243d;color:#fff;border:0;border-radius:7px;padding:12px 15px;width:100%;font-weight:bold;letter-spacing:.2px;cursor:pointer;transition:transform .22s,box-shadow .22s,background .22s}
.buy-now-card:before{content:"";position:absolute;top:-60%;left:-75%;width:45%;height:220%;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:rotate(25deg);transition:left .55s}
.buy-now-card:hover{background:#183b5e;transform:translateY(-3px);box-shadow:0 8px 18px #10243d35}
.buy-now-card:hover:before{left:135%}
.buy-now-card:active{transform:scale(.97)}
.buy-now-card .cart-icon{display:inline-block;margin-right:7px;transition:transform .22s}
.buy-now-card:hover .cart-icon{transform:translateX(3px) rotate(-8deg)}
.buy-now-card:disabled{background:#999;color:white;cursor:not-allowed;transform:none;box-shadow:none}
.buy-now-card:disabled:before{display:none}

.products-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  align-items:stretch;
}

.product-card{
  display:flex;
  flex-direction:column;
  height:100%;
  background:white;
  border-radius:9px;
  overflow:hidden;
  box-shadow:0 2px 9px #0001;
}

.product-image-wrap{position:relative}
.product-card img{width:100%;height:220px;object-fit:cover;background:#eee;cursor:pointer;display:block}
.stock-badge{position:absolute;top:12px;left:12px;background:#b52d2d;color:white;padding:7px 11px;border-radius:5px;font-size:12px;font-weight:bold;letter-spacing:.5px;box-shadow:0 2px 7px #0003}
.sale-badge{position:absolute;top:12px;right:12px;background:#d6ad62;color:#10243d;padding:7px 11px;border-radius:5px;font-size:12px;font-weight:bold;box-shadow:0 2px 7px #0002}

.product-info{
  padding:15px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.product-info h3{margin:7px 0;cursor:pointer}
.category-name{font-size:12px;color:#777}
.price{font-size:18px;font-weight:bold;color:#a87928;margin:12px 0}
.price-old{font-size:14px;color:#888;text-decoration:line-through;margin-right:8px;font-weight:normal}
.price-new{font-size:21px;color:#a52b2b;font-weight:bold}
.discount-label{display:inline-block;background:#fff0e8;color:#a52b2b;padding:4px 7px;border-radius:4px;font-size:11px;font-weight:bold;margin-top:5px}
.out-of-stock-info{color:#a52b2b;font-size:13px;font-weight:bold;margin:10px 0}

.product-info .buy-now-card{
  margin-top:auto;
}

button{font-family:inherit}
.primary,.secondary,.danger{border:0;border-radius:5px;padding:11px 15px;cursor:pointer}
.primary{background:#10243d;color:white}
.secondary{background:#d6ad62;color:#10243d}
.danger{background:#a52b2b;color:white}
.full{width:100%}
.pagination{display:flex;justify-content:center;gap:7px;margin:25px 0;flex-wrap:wrap}
.pagination button{padding:9px 13px;border:1px solid #10243d;background:white;border-radius:5px;cursor:pointer}
.pagination button.active{background:#10243d;color:white}
.empty{text-align:center;padding:35px;color:#777;grid-column:1/-1}
.cart-count{background:#d6ad62;color:#10243d;border-radius:50%;padding:3px 7px;font-size:12px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;overflow-y:auto;padding:20px}
.modal.show{display:flex;align-items:flex-start;justify-content:center}
.modal-box{background:white;border-radius:10px;width:100%;max-width:750px;margin:auto;padding:22px;position:relative}
.close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:27px;cursor:pointer}
.cart-line{display:grid;grid-template-columns:75px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding:13px 0}
.cart-line img{width:75px;height:75px;object-fit:cover;border-radius:5px}
.cart-line input{width:60px;padding:7px}
.total{font-size:20px;font-weight:bold;text-align:right;margin:20px 0}
.field{margin:13px 0}
.field label{display:block;font-weight:bold;margin-bottom:6px}
.field select,.field input,.field textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:5px;font-size:15px}
.message{padding:12px;background:#f4f4f4;border-radius:6px;margin:12px 0}
.status-message{text-align:center;padding:20px;color:#777}
footer{background:#10243d;color:white;text-align:center;padding:22px;margin-top:35px}

@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .categories{display:flex;gap:7px;flex-wrap:wrap}
  .categories h3{width:100%}
  .category-btn{width:auto}
  .products-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:550px){
  .products-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .product-card img{height:150px}
  .product-info{padding:10px}
  .product-info h3{font-size:14px}
  .category-name{font-size:10px}
  .price{font-size:15px}
  .price-old{font-size:11px}
  .price-new{font-size:17px}
  .discount-label{font-size:10px}
  .buy-now-card{padding:10px 5px;font-size:12px}
  .cart-line{grid-template-columns:60px 1fr}
  .cart-line img{width:60px;height:60px}
}
</style>
</head>

<body>

<header>
  <div class="logo">CEYLORIA</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="account.html">My Account</a>
    <a href="track.html">Track Order</a>
    <a href="cart.html">
      Cart <span class="cart-count" id="cartCount">0</span>
    </a>
  </nav>
</header>

<section class="hero">
  <h1>Our Products</h1>
  <p>Discover beautiful handcrafted Sri Lankan souvenirs.</p>
</section>

<div class="container">
  <input class="search" id="searchInput" type="search"
    placeholder="Search products..." oninput="filterProducts()">

  <div class="layout">
    <aside class="categories">
      <h3>Categories</h3>
      <div id="categoryButtons">
        <button class="category-btn active" data-category="All Products"
          onclick="selectCategory('All Products')">All Products</button>
      </div>
    </aside>

    <main>
      <div class="products-top">
        <h2 id="categoryTitle">All Products</h2>
        <span id="resultCount"></span>
      </div>

      <div class="products-grid" id="productsGrid">
        <div class="status-message">Loading products...</div>
      </div>

      <div class="pagination" id="pagination"></div>
    </main>
  </div>
</div>

<div class="modal" id="checkoutModal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('checkoutModal')">&times;</button>
    <h2>Checkout</h2>
    <div id="checkoutSummary"></div>

    <div class="field">
      <label for="paymentMethod">Payment Method</label>
      <select id="paymentMethod">
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="Bank Transfer">Bank Transfer</option>
      </select>
    </div>

    <div class="field">
      <label for="deliveryCountry">Country</label>
      <input id="deliveryCountry" type="text" value="Sri Lanka">
    </div>

    <div class="field">
      <label for="orderNotes">Order Notes (Optional)</label>
      <textarea id="orderNotes" rows="3"></textarea>
    </div>

    <div class="message">
      Please sign in to your Ceyloria account before placing an order.
    </div>

    <button class="primary full" id="placeOrderButton" onclick="placeOrder()">Place Order</button>
    <p id="checkoutMessage"></p>
  </div>
</div>

<footer>© 2026 Ceyloria Souvenirs. All Rights Reserved.</footer>

<script>
const API_BASE = "https://ceyloria-souvenier-2.onrender.com";

const PRODUCTS_PER_PAGE = 12;
const CART_KEY = "ceyloriaCart";
const BUY_NOW_KEY = "ceyloriaBuyNow";

let products = [];
let categories = [];
let selectedCategory = "All Products";
let selectedSubcategory = "";
let expandedCategories = [];
let currentPage = 1;

let cart = getStoredCart();

/*
  CHECKOUT STATE

  checkoutItems contains only the items being checked out.
  checkoutMode is either "cart" or "buy-now".
*/

let checkoutItems = [];
let checkoutMode = "cart";

function getStoredCart() {
  try {
    const data = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch(error) {
    return [];
  }
}

function getStoredBuyNow() {
  try {
    const data = JSON.parse(localStorage.getItem(BUY_NOW_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch(error) {
    return [];
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function money(value) {
  return "Rs. " + Number(value || 0).toLocaleString("en-US", {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function parseArray(value) {
  if (Array.isArray(value)) return value;

  if (typeof value === "string") {
    try {
      const parsed = JSON.parse(value);
      return Array.isArray(parsed) ? parsed : [];
    } catch(error) {
      return value ? [value] : [];
    }
  }

  return [];
}

function normalizeCategory(c) {
  return {
    id: c.id,
    name: c.name || "",
    parentId: c.parentId ?? c.parent_id ?? null,
    children: Array.isArray(c.children)
      ? c.children.map(normalizeCategory)
      : Array.isArray(c.subcategories)
        ? c.subcategories.map(normalizeCategory)
        : []
  };
}

function normalizeProduct(p) {
  const mainCategory =
    p.mainCategory ||
    p.main_category ||
    p.category ||
    p.category_name ||
    "";

  const subcategory =
    p.subcategory ||
    p.subcategory_name ||
    "";

  let images = parseArray(
    p.images || p.image || p.imagePaths || p.image_paths
  );

  images = images.map(img => {
    if (typeof img === "object" && img !== null) {
      return img.url || img.path || img.image || "";
    }
    return img;
  }).filter(Boolean);

  let sizes = parseArray(p.sizes);

  sizes = sizes.map(s => {
    if (typeof s === "string") {
      try {
        return JSON.parse(s);
      } catch(e) {
        return {size:s,price:p.price};
      }
    }
    return s;
  }).filter(s => s && s.size);

  const rawDiscount = p.discountPrice ?? p.discount_price;
  const discountPrice = rawDiscount === null ||
    rawDiscount === undefined || rawDiscount === ""
      ? null
      : Number(rawDiscount);

  const rawStock =
    p.stockQuantity ?? p.stock_quantity ?? p.stock ?? p.quantity;

  const stock = rawStock === null ||
    rawStock === undefined || rawStock === ""
      ? null
      : Number(rawStock);

  return {
    id: p.id,
    name: p.name || p.title || "Unnamed Product",
    category: typeof mainCategory === "object"
      ? (mainCategory.name || "")
      : mainCategory,
    categoryId: p.mainCategoryId || p.categoryId || p.category_id ||
      (typeof p.category === "object" ? p.category.id : null),
    subcategory: typeof subcategory === "object"
      ? (subcategory.name || "")
      : subcategory,
    subcategoryId: p.subcategoryId || p.subcategory_id ||
      (typeof p.subcategory === "object" ? p.subcategory.id : null),
    description: p.description || p.desc || "",
    price: Number(p.price || 0),
    discountPrice: Number.isFinite(discountPrice) ? discountPrice : null,
    stock: Number.isFinite(stock) ? stock : null,
    images,
    image: images[0] || "",
    sizes,
    colours: parseArray(p.colours || p.colors)
  };
}

function isOutOfStock(product) {
  return product.stock !== null && product.stock <= 0;
}

function hasDiscount(product) {
  return !product.sizes.length &&
    product.discountPrice !== null &&
    product.discountPrice > 0 &&
    product.discountPrice < product.price;
}

function getProductPrice(product, size) {
  if (product.sizes && product.sizes.length) {
    const found = product.sizes.find(s => String(s.size) === String(size));
    return Number(found ? found.price : product.sizes[0].price);
  }

  return hasDiscount(product)
    ? product.discountPrice
    : Number(product.price || 0);
}

/* LOAD PRODUCTS */

async function loadProducts() {
  const grid = document.getElementById("productsGrid");
  grid.innerHTML = '<div class="status-message">Loading products...</div>';

  try {
    const response = await fetch(API_BASE + "/api/products", {
      credentials: "include"
    });

    if (!response.ok) {
      throw new Error("Unable to load products from server.");
    }

    const data = await response.json();

    const productList = Array.isArray(data)
      ? data
      : (data.products || []);

    products = productList.map(normalizeProduct);

    const categoryList = Array.isArray(data.categories)
      ? data.categories
      : [];

    categories = categoryList.map(normalizeCategory);

    if (categories.length && !categories.some(c => c.children.length)) {
      categories = categories
        .filter(c => !c.parentId)
        .map(main => ({
          ...main,
          children: categoryList
            .filter(child => String(child.parentId) === String(main.id))
            .map(normalizeCategory)
        }));
    }

    if (!categories.length) {
      const mains = new Map();

      products.forEach(p => {
        const key = String(p.categoryId || p.category);

        if (!mains.has(key)) {
          mains.set(key, {
            id: p.categoryId || key,
            name: p.category,
            children: []
          });
        }

        if (p.subcategory) {
          const main = mains.get(key);

          if (!main.children.some(c => c.name === p.subcategory)) {
            main.children.push({
              id: p.subcategoryId || p.subcategory,
              name: p.subcategory,
              parentId: main.id,
              children: []
            });
          }
        }
      });

      categories = [...mains.values()];
    }

    buildCategories();

    const params = new URLSearchParams(window.location.search);
    const requestedCategory = params.get("category");
    const requestedSubcategory = params.get("subcategory");

    if (requestedCategory) {
      const foundMain = categories.find(c =>
        String(c.id) === requestedCategory ||
        c.name.toLowerCase() === requestedCategory.toLowerCase()
      );

      if (foundMain) {
        selectedCategory = foundMain.name;

        if (requestedSubcategory) {
          const foundSub = foundMain.children.find(c =>
            String(c.id) === requestedSubcategory ||
            c.name.toLowerCase() === requestedSubcategory.toLowerCase()
          );

          if (foundSub) {
            selectedSubcategory = foundSub.name;
            expandedCategories.push(String(foundMain.id));
          }
        }
      }
    }

    buildCategories();
    updateCategoryButtons();
    displayProducts();

    /*
      BUY NOW CHECKOUT:
      Read the separate Buy Now item.
      Never use the normal cart for this checkout.
    */

    if (
      params.get("checkout") === "1" &&
      params.get("mode") === "buy-now"
    ) {
      const buyNowItems = getStoredBuyNow();

      if (!buyNowItems.length) {
        alert("Buy Now item not found. Please select the product again.");

        window.history.replaceState(
          {},
          "",
          "products.html"
        );

        return;
      }

      goCheckout(buyNowItems, "buy-now");
      return;
    }

    /*
      NORMAL CART CHECKOUT
    */

    if (params.get("checkout") === "1") {
      const normalCart = getStoredCart();

      if (normalCart.length) {
        goCheckout(normalCart, "cart");
      } else {
        alert("Your cart is empty.");

        window.history.replaceState(
          {},
          "",
          "products.html"
        );
      }
    }

  } catch(error) {
    console.error(error);

    grid.innerHTML = `
      <div class="empty">
        Products load karanna bari una.<br><br>
        Server eka running da kiyala check karanna.<br>
        <button class="primary" onclick="loadProducts()">Try Again</button>
      </div>
    `;
  }
}

/* CATEGORY MENU */

function buildCategories() {
  const container = document.getElementById("categoryButtons");

  let html = `
    <button class="category-btn"
      data-category="All Products"
      onclick="selectCategory('All Products')">
      All Products
    </button>
  `;

  categories.forEach(main => {
    const hasChildren = main.children && main.children.length > 0;
    const expanded = expandedCategories.includes(String(main.id));

    html += `
      <div class="category-group">
        <div class="category-main-row">
          <button class="category-btn"
            data-category="${escapeHTML(main.name)}"
            onclick="selectCategoryByName(this.dataset.category)">
            ${escapeHTML(main.name)}
          </button>

          ${hasChildren ? `
            <button class="category-toggle"
              aria-label="Show subcategories"
              aria-expanded="${expanded}"
              onclick="toggleSubcategories('${escapeHTML(main.id)}',this)">
              ›
            </button>
          ` : ""}
        </div>

        ${hasChildren ? `
          <div class="subcategory-list ${expanded ? "open" : ""}"
            id="subcategories-${escapeHTML(main.id)}">
            ${main.children.map(child => `
              <button class="subcategory-btn"
                data-main="${escapeHTML(main.name)}"
                data-sub="${escapeHTML(child.name)}"
                onclick="selectSubcategory(this.dataset.main,this.dataset.sub)">
                ${escapeHTML(child.name)}
              </button>
            `).join("")}
          </div>
        ` : ""}
      </div>
    `;
  });

  container.innerHTML = html;
  updateCategoryButtons();
}

function toggleSubcategories(id, button) {
  const key = String(id);
  const list = document.getElementById("subcategories-" + id);

  if (!list) return;

  const isOpen = list.classList.toggle("open");
  button.setAttribute("aria-expanded", String(isOpen));

  if (isOpen) {
    if (!expandedCategories.includes(key)) {
      expandedCategories.push(key);
    }
  } else {
    expandedCategories = expandedCategories.filter(x => x !== key);
  }
}

function selectCategoryByName(name) {
  selectCategory(name);
}

function selectCategory(category) {
  selectedCategory = category;
  selectedSubcategory = "";
  currentPage = 1;

  updateCategoryButtons();
  displayProducts();
}

function selectSubcategory(main, sub) {
  selectedCategory = main;
  selectedSubcategory = sub;
  currentPage = 1;

  updateCategoryButtons();
  displayProducts();
}

function updateCategoryButtons() {
  document.querySelectorAll(".category-btn").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.category === selectedCategory
    );
  });

  document.querySelectorAll(".subcategory-btn").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.main === selectedCategory &&
      button.dataset.sub === selectedSubcategory
    );
  });

  const title = selectedSubcategory
    ? selectedCategory + " - " + selectedSubcategory
    : selectedCategory;

  document.getElementById("categoryTitle").textContent = title;
}

/* FILTER PRODUCTS */

function getFilteredProducts() {
  const search = document.getElementById("searchInput")
    .value.toLowerCase().trim();

  return products.filter(p => {
    const mainMatch =
      selectedCategory === "All Products" ||
      p.category === selectedCategory;

    const subMatch =
      !selectedSubcategory ||
      p.subcategory === selectedSubcategory;

    const searchMatch = (
      p.name + " " +
      p.category + " " +
      p.subcategory + " " +
      p.description
    ).toLowerCase().includes(search);

    return mainMatch && subMatch && searchMatch;
  });
}

function filterProducts() {
  currentPage = 1;
  displayProducts();
}

function openProductDetails(id) {
  window.location.href =
    "product-details.html?id=" + encodeURIComponent(id);
}

/* DISPLAY PRODUCTS */

function displayProducts() {
  const filtered = getFilteredProducts();
  const totalPages = Math.ceil(filtered.length / PRODUCTS_PER_PAGE);

  if (currentPage > totalPages) currentPage = 1;

  const start = (currentPage - 1) * PRODUCTS_PER_PAGE;
  const pageProducts = filtered.slice(start, start + PRODUCTS_PER_PAGE);

  document.getElementById("resultCount").textContent =
    filtered.length + " products";

  const grid = document.getElementById("productsGrid");

  if (!pageProducts.length) {
    grid.innerHTML = '<div class="empty">No products found.</div>';
  } else {
    grid.innerHTML = pageProducts.map(p => {
      const outOfStock = isOutOfStock(p);
      const discounted = hasDiscount(p);

      let priceHTML = "";

      if (p.sizes.length) {
        priceHTML = "From " + money(p.sizes[0].price);
      } else if (discounted) {
        const saving = Math.round(
          ((p.price - p.discountPrice) / p.price) * 100
        );

        priceHTML = `
          <span class="price-old">${money(p.price)}</span>
          <span class="price-new">${money(p.discountPrice)}</span>
          <br>
          <span class="discount-label">${saving}% OFF</span>
        `;
      } else {
        priceHTML = money(p.price);
      }

      return `
        <article class="product-card">
          <div class="product-image-wrap">
            <img
              src="${escapeHTML(p.image)}"
              alt="${escapeHTML(p.name)}"
              onclick="openProductDetails(this.dataset.id)"
              data-id="${escapeHTML(p.id)}"
              onerror="this.src='assets/product-placeholder.png'">

            ${outOfStock ? `
              <span class="stock-badge">OUT OF STOCK</span>
            ` : ""}

            ${discounted && !outOfStock ? `
              <span class="sale-badge">SPECIAL OFFER</span>
            ` : ""}
          </div>

          <div class="product-info">
            <span class="category-name">
              ${escapeHTML(p.category)}
              ${p.subcategory ? " / " + escapeHTML(p.subcategory) : ""}
            </span>

            <h3
              onclick="openProductDetails(this.dataset.id)"
              data-id="${escapeHTML(p.id)}">
              ${escapeHTML(p.name)}
            </h3>

            <div class="price">${priceHTML}</div>

            ${outOfStock ? `
              <div class="out-of-stock-info">
                Currently unavailable
              </div>
            ` : ""}

            <button class="buy-now-card"
              ${outOfStock ? "disabled" : ""}
              onclick="openProductDetails(this.dataset.id)"
              data-id="${escapeHTML(p.id)}">
              <span class="cart-icon">🛒</span>
              ${outOfStock ? "Out of Stock" : "Buy Now"}
            </button>
          </div>
        </article>
      `;
    }).join("");
  }

  displayPagination(totalPages);
}

function displayPagination(totalPages) {
  const el = document.getElementById("pagination");

  if (totalPages <= 1) {
    el.innerHTML = "";
    return;
  }

  let html = "";

  if (currentPage > 1) {
    html += `<button onclick="changePage(${currentPage - 1})">Previous</button>`;
  }

  for (let i = 1; i <= totalPages; i++) {
    html += `
      <button class="${i === currentPage ? "active" : ""}"
        onclick="changePage(${i})">${i}</button>
    `;
  }

  if (currentPage < totalPages) {
    html += `<button onclick="changePage(${currentPage + 1})">Next</button>`;
  }

  el.innerHTML = html;
}

function changePage(page) {
  currentPage = page;
  displayProducts();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* NORMAL CART STORAGE */

function saveCart() {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function updateCartCount() {
  cart = getStoredCart();

  const count = cart.reduce((sum, item) => {
    return sum + Number(item.qty ?? item.quantity ?? 0);
  }, 0);

  document.getElementById("cartCount").textContent = count;
}

function getCartProduct(item) {
  return products.find(p =>
    String(p.id) === String(item.id ?? item.productId)
  );
}

function getPrice(product, size) {
  return getProductPrice(product, size);
}

/* ADD TO CART FUNCTION */

function addToCart(product, size, quantity) {
  if (isOutOfStock(product)) {
    alert("Sorry, this product is currently out of stock.");
    return;
  }

  const existing = cart.find(item =>
    String(item.id ?? item.productId) === String(product.id) &&
    (item.size || "") === (size || "")
  );

  const selectedPrice = getPrice(product, size);

  if (existing) {
    const newQuantity =
      Number(existing.qty ?? existing.quantity ?? 0) + quantity;

    existing.qty = newQuantity;
    existing.quantity = newQuantity;
    existing.price = selectedPrice;
  } else {
    cart.push({
      id: product.id,
      productId: product.id,
      name: product.name,
      title: product.name,
      price: selectedPrice,
      image: product.image || "",
      size: size || "",
      qty: quantity,
      quantity: quantity
    });
  }

  saveCart();
  updateCartCount();
}

/*
  CHECKOUT

  items = the exact products to checkout.
  mode = "cart" or "buy-now".
*/

function goCheckout(items = getStoredCart(), mode = "cart") {

  if (!Array.isArray(items) || !items.length) {
    alert("Your cart is empty.");
    return;
  }

  checkoutItems = items.map(item => ({
    ...item,
    qty: Number(item.qty ?? item.quantity ?? 1),
    quantity: Number(item.qty ?? item.quantity ?? 1)
  }));

  checkoutMode = mode;

  let total = 0;
  let summary = "<h3>Order Summary</h3>";

  checkoutItems.forEach(item => {

    const name = item.name || item.title || "Product";
    const size = item.size || "";
    const quantity = Number(item.qty ?? item.quantity ?? 1);

    /*
      Use the saved selected price.
      This preserves the selected size and discount price.
    */

    const price = Number(item.price || 0);

    total += price * quantity;

    summary += `
      <p>
        ${escapeHTML(name)}
        ${size ? "(" + escapeHTML(size) + ")" : ""}
        × ${quantity} = ${money(price * quantity)}
      </p>
    `;
  });

  summary += `<div class="total">Total: ${money(total)}</div>`;

  document.getElementById("checkoutSummary").innerHTML = summary;
  document.getElementById("checkoutMessage").textContent = "";

  document.getElementById("placeOrderButton").disabled = false;

  showModal("checkoutModal");
}

/* PLACE ORDER */

async function placeOrder() {

  const message = document.getElementById("checkoutMessage");
  const button = document.getElementById("placeOrderButton");

  if (!checkoutItems.length) {
    message.textContent = "No products selected for checkout.";
    return;
  }

  button.disabled = true;
  message.textContent = "Checking your account...";

  try {

    const authResponse = await fetch(API_BASE + "/api/auth/me", {
      credentials: "include"
    });

    const authData = await authResponse.json();

    if (!authResponse.ok || !authData.loggedIn || !authData.customer) {

      message.innerHTML =
        'Please <a href="login.html">login</a> to place your order.';

      button.disabled = false;
      return;
    }

    const customer = authData.customer;

    const customerDetails = {
      name: customer.name || customer.fullName || "",
      phone: customer.phone || customer.mobile || "",
      email: customer.email || "",
      address: customer.address || customer.deliveryAddress || ""
    };

    /*
      Send only the selected checkout items to the server.
      Do not send the whole cart during Buy Now.
    */

    const orderItems = checkoutItems.map(item => ({
      productId: item.id ?? item.productId,
      quantity: Number(item.qty ?? item.quantity ?? 1),
      size: item.size || "",
      colour: item.colour || ""
    }));

    message.textContent = "Placing your order...";

    const response = await fetch(API_BASE + "/api/orders", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        customer: customerDetails,
        payment: document.getElementById("paymentMethod").value,
        country: document.getElementById("deliveryCountry").value,
        notes: document.getElementById("orderNotes").value || "",
        items: orderItems
      })
    });

    const result = await response.json();

    if (!response.ok || result.success === false) {
      throw new Error(
        result.error || result.message || "Unable to place order."
      );
    }

    /*
      CLEAR ONLY THE CHECKED-OUT SOURCE.

      Cart checkout:
      Clear the normal cart.

      Buy Now checkout:
      Clear only the temporary Buy Now item.
      Keep the normal cart untouched.
    */

    if (checkoutMode === "buy-now") {

      localStorage.removeItem(BUY_NOW_KEY);

    } else {

      cart = [];
      saveCart();
      updateCartCount();

    }

    checkoutItems = [];

    if (result.invoiceToken) {

      window.location.href =
        "./invoice.html?token=" +
        encodeURIComponent(result.invoiceToken);

    } else {

      message.textContent =
        result.message || "Order placed successfully!";

      button.disabled = false;

    }

  } catch(error) {

    console.error("Order error:", error);

    message.textContent =
      error.message || "Unable to place order. Please try again.";

    button.disabled = false;

  }
}

/* MODAL */

function showModal(id) {
  document.getElementById(id).classList.add("show");
}

function closeModal(id) {
  document.getElementById(id).classList.remove("show");
}

/* START */

updateCartCount();
loadProducts();

</script>
