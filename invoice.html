
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceyloria | Order Invoice</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f3ee;
  color:#172b43;
}
header{
  background:#10243d;
  color:#fff;
  padding:22px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:24px;font-weight:bold;letter-spacing:3px}
header a{color:#d4ad58;text-decoration:none;font-weight:bold}
main{max-width:850px;margin:40px auto;padding:0 18px}
.invoice{
  background:#fff;
  padding:35px;
  border:1px solid #e4dfd4;
  border-radius:8px;
}
.top{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  border-bottom:2px solid #d4ad58;
  padding-bottom:20px;
}
h1{margin:0 0 8px;font-size:30px}
.gold{color:#b58b36}
.muted{color:#777;font-size:14px}
.section{margin-top:28px}
.section h3{
  margin-bottom:12px;
  color:#10243d;
  border-bottom:1px solid #eee;
  padding-bottom:8px;
}
.details p{margin:7px 0;line-height:1.5}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:13px 10px;border-bottom:1px solid #eee;text-align:left}
th{background:#10243d;color:white}
.right{text-align:right}
.total{
  margin-top:20px;
  text-align:right;
  font-size:22px;
  font-weight:bold;
}
.status{
  display:inline-block;
  background:#f5edda;
  color:#8b6823;
  padding:8px 14px;
  border-radius:20px;
  font-weight:bold;
}
.actions{display:flex;gap:12px;margin-top:25px;flex-wrap:wrap}
button,.button{
  border:0;
  padding:13px 20px;
  background:#10243d;
  color:white;
  cursor:pointer;
  text-decoration:none;
  font-weight:bold;
  border-radius:4px;
}
button:hover,.button:hover{background:#d4ad58;color:#10243d}
.error{text-align:center;padding:50px 15px}
@media(max-width:600px){
  .invoice{padding:20px}
  header{padding:18px 5%}
  h1{font-size:24px}
  th,td{padding:10px 6px;font-size:13px}
}
@media print{
  header,.actions{display:none}
  body{background:white}
  main{margin:0;max-width:100%;padding:0}
  .invoice{border:0}
}
</style>
</head>
<body>

<header>
  <div class="logo">CEYLORIA</div>
  <a href="/">BACK TO STORE</a>
</header>

<main>
  <div class="invoice" id="invoice">
    <div class="error">Loading your invoice...</div>
  </div>
</main>

<script>
async function loadInvoice(){
  const container = document.getElementById('invoice');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if(!token){
    container.innerHTML = '<div class="error"><h2>Invoice Not Found</h2><p>Invoice token is missing.</p><a class="button" href="/">Back to Store</a></div>';
    return;
  }

  try{
    const response = await fetch('/api/invoice/' + encodeURIComponent(token), {
      method:'GET',
      credentials:'same-origin'
    });

    const result = await response.json();

    if(!response.ok || result.success === false){
      throw new Error(result.message || 'Unable to load invoice.');
    }

    const order = result.order || result.invoice || result;

    const money = value => 'LKR ' + Number(value || 0).toLocaleString('en-US', {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });

    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[char]);

    const items = Array.isArray(order.items) ? order.items : [];

    const itemRows = items.map(item => {
      const name = item.name || item.title || 'Product';
      const quantity = Number(item.quantity || item.qty || 1);
      const price = Number(item.price || 0);
      const lineTotal = Number(item.total || item.subtotal || (price * quantity));

      return `
        <tr>
          <td>${escapeHTML(name)}</td>
          <td>${quantity}</td>
          <td class="right">${money(price)}</td>
          <td class="right">${money(lineTotal)}</td>
        </tr>
      `;
    }).join('');

    const date = order.createdAt
      ? new Date(order.createdAt).toLocaleString()
      : 'Not available';

    container.innerHTML = `
      <div class="top">
        <div>
          <h1>ORDER <span class="gold">INVOICE</span></h1>
          <p class="muted">Thank you for shopping with Ceyloria.</p>
        </div>
        <div>
          <div class="logo gold">CEYLORIA</div>
          <p class="muted">Sri Lankan Souvenirs</p>
        </div>
      </div>

      <div class="section">
        <p><strong>Order Number:</strong> ${escapeHTML(order.orderNumber || 'Not available')}</p>
        <p><strong>Order Date:</strong> ${escapeHTML(date)}</p>
        <p><strong>Order Status:</strong> <span class="status">${escapeHTML(order.status || 'Order Confirmed')}</span></p>
      </div>

      <div class="section details">
        <h3>Customer Details</h3>
        <p><strong>Name:</strong> ${escapeHTML(order.name || '')}</p>
        <p><strong>Phone:</strong> ${escapeHTML(order.phone || '')}</p>
        <p><strong>Email:</strong> ${escapeHTML(order.email || '')}</p>
        <p><strong>Delivery Address:</strong> ${escapeHTML(order.address || '')}</p>
        <p><strong>Country:</strong> ${escapeHTML(order.country || '')}</p>
      </div>

      <div class="section">
        <h3>Order Items</h3>
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Qty</th>
              <th class="right">Price</th>
              <th class="right">Total</th>
            </tr>
          </thead>
          <tbody>
            ${itemRows || '<tr><td colspan="4">No item details available.</td></tr>'}
          </tbody>
        </table>
        <div class="total">Total: ${money(order.subtotal)}</div>
      </div>

      <div class="section details">
        <h3>Payment Details</h3>
        <p><strong>Payment Method:</strong> ${escapeHTML(order.payment || '')}</p>
        <p><strong>Order Notes:</strong> ${escapeHTML(order.notes || 'None')}</p>
      </div>

      <div class="actions">
        <button onclick="window.print()">Print Invoice</button>
        <a class="button" href="/account.html">My Account</a>
        <a class="button" href="/">Continue Shopping</a>
      </div>
    `;

  }catch(error){
    console.error('Invoice error:', error);
    container.innerHTML = `
      <div class="error">
        <h2>Unable to Load Invoice</h2>
        <p>${String(error.message || 'Please try again.')}</p>
        <a class="button" href="/account.html">My Account</a>
      </div>
    `;
  }
}

loadInvoice();
</script>

</body>
</html>
